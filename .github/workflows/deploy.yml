name: Deploy to production

# Автодеплой: каждый push в main заходит на сервер по SSH и запускает
# deploy/deploy.sh (git pull → сборка при необходимости → перезапуск бэкенда).
# Можно запустить и вручную — вкладка Actions → Deploy to production → Run.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Не запускать два деплоя параллельно; текущий не прерывать.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true          # падать на первой ошибке
          command_timeout: 15m        # npm build может быть небыстрым
          script: |
            cd /opt/nexusdata
            bash deploy/deploy.sh
