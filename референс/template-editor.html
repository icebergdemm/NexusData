<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Документы — создание по шаблону</title>
<style>
/* ============ ОБОЛОЧКА РЕДАКТОРА (тёмная тема как в вашем UI) ============ */
:root{
  --bg:#111214; --bg-panel:#191a1d; --bg-hover:#232428;
  --border:#2c2d31; --text:#e7e8ea; --text-dim:#8b8d93;
  --accent:#3d7bfd; --accent-hover:#5a90ff;
  --danger:#e5484d;
  --doc-w:794px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,'Segoe UI',Roboto,Arial,sans-serif}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ---------- экран выбора шаблона ---------- */
.screen{display:none;height:100%}
.screen.active{display:flex;flex-direction:column}
.create-wrap{max-width:860px;margin:0 auto;padding:64px 24px;width:100%}
.create-wrap h1{font-size:22px;font-weight:600;margin-bottom:6px}
.create-wrap p.sub{color:var(--text-dim);margin-bottom:28px}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.tpl-card{background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;padding:0;overflow:hidden;text-align:left;transition:border-color .15s, transform .15s}
.tpl-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.tpl-card .thumb{height:150px;background:#f2f0eb;position:relative;overflow:hidden}
.tpl-card .thumb .mini{position:absolute;inset:14px;background:#fff;border-radius:2px;box-shadow:0 1px 4px rgba(0,0,0,.2);padding:10px 12px;font-family:Georgia,serif;color:#222;font-size:6px;line-height:1.5}
.mini .m-grif{text-align:right;font-weight:700;font-size:5px;letter-spacing:.5px}
.mini .m-head{border:1px solid #333;margin:5px 0;padding:4px 5px;text-align:center}
.mini .m-head b{display:block;font-size:6.5px}
.mini .m-line{height:3px;background:#ddd;border-radius:2px;margin:3px 0}
.mini .m-line.w60{width:60%}.mini .m-line.w80{width:80%}
.tpl-card .thumb.blank .mini{display:flex;align-items:center;justify-content:center;color:#aaa;font-size:20px;font-family:inherit}
.tpl-card .meta{padding:12px 14px}
.tpl-card .meta .name{font-weight:600;font-size:14px}
.tpl-card .meta .desc{color:var(--text-dim);font-size:12px;margin-top:3px}

/* ---------- шапка редактора ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg);flex:0 0 auto}
.topbar .back{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--text-dim)}
.topbar .back:hover{background:var(--bg-hover);color:var(--text)}
.doc-title{background:var(--bg-panel);border:1px solid transparent;border-radius:8px;color:var(--text);font-size:14px;font-weight:500;padding:7px 12px;min-width:280px;outline:none}
.doc-title:hover{border-color:var(--border)}
.doc-title:focus{border-color:var(--accent)}
.save-state{color:var(--text-dim);font-size:12.5px;display:flex;align-items:center;gap:5px}
.save-state .ok{color:#4cc38a}
.topbar .spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:8px;font-size:13.5px;font-weight:500;border:1px solid var(--border);background:var(--bg-panel)}
.btn:hover{background:var(--bg-hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}

/* ---------- панель форматирования ---------- */
.toolbar{display:flex;align-items:center;gap:2px;padding:6px 16px;border-bottom:1px solid var(--border);background:var(--bg);flex:0 0 auto;flex-wrap:wrap}
.tb{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--text-dim);font-size:14px}
.tb:hover{background:var(--bg-hover);color:var(--text)}
.tb b{font-family:Georgia,serif}
.tb-sep{width:1px;height:18px;background:var(--border);margin:0 6px}
.toolbar .hint{margin-left:auto;color:var(--text-dim);font-size:12px}

/* ---------- рабочая область ---------- */
.workspace{flex:1;overflow:auto;padding:36px 16px 120px}
.page{width:var(--doc-w);max-width:100%;margin:0 auto;background:#fff;color:#000;border-radius:3px;box-shadow:0 2px 24px rgba(0,0,0,.45);padding:76px 85px 90px;min-height:1000px}

/* ---------- обёртка блока с контролами ---------- */
.blk{position:relative;border-radius:4px}
.blk:hover{outline:1px dashed rgba(61,123,253,.45);outline-offset:6px}
.blk-ctl{position:absolute;top:-4px;right:calc(100% + 14px);display:none;flex-direction:column;gap:2px;background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:3px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.blk:hover .blk-ctl{display:flex}
.blk-ctl button{width:26px;height:26px;border-radius:5px;color:var(--text-dim);font-size:13px;display:grid;place-items:center}
.blk-ctl button:hover{background:var(--bg-hover);color:var(--text)}
.blk-ctl button.del:hover{color:var(--danger)}
.blk-tag{position:absolute;bottom:calc(100% + 2px);left:0;font:10.5px/1 -apple-system,'Segoe UI',sans-serif;color:var(--accent);background:rgba(61,123,253,.12);padding:2px 7px;border-radius:4px;display:none;letter-spacing:.2px}
.blk:hover .blk-tag{display:block}

/* ---------- разделитель «добавить блок» ---------- */
.adder{position:relative;height:14px;display:flex;align-items:center;justify-content:center}
.adder .line{position:absolute;left:0;right:0;top:50%;height:1px;background:transparent;transition:background .12s}
.adder:hover .line{background:rgba(61,123,253,.4)}
.adder .plus{position:relative;z-index:1;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:15px;line-height:1;display:grid;place-items:center;opacity:0;transform:scale(.8);transition:opacity .12s,transform .12s}
.adder:hover .plus,.adder.open .plus{opacity:1;transform:scale(1)}

/* ---------- меню вставки блоков ---------- */
.blockmenu{position:fixed;z-index:60;width:560px;max-width:calc(100vw - 24px);background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.55);padding:14px;display:none}
.blockmenu.open{display:block}
.blockmenu .bm-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.blockmenu h4{font-size:11px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--text-dim);margin:2px 4px 8px}
.bm-item{display:flex;gap:10px;width:100%;text-align:left;padding:8px;border-radius:8px;align-items:flex-start}
.bm-item:hover{background:var(--bg-hover)}
.bm-item .ic{flex:0 0 30px;height:30px;border-radius:7px;background:var(--bg);border:1px solid var(--border);display:grid;place-items:center;font-size:13px;color:var(--accent)}
.bm-item .t{font-size:13px;font-weight:500}
.bm-item .d{font-size:11.5px;color:var(--text-dim);margin-top:1px}

/* ---------- нижняя строка ---------- */
.statusbar{position:fixed;left:0;bottom:0;right:0;padding:8px 16px;font-size:12px;color:var(--text-dim);background:linear-gradient(transparent, var(--bg) 40%);pointer-events:none}

/* ---------- модалка сохранения ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--bg-panel);border:1px solid var(--border);border-radius:14px;width:820px;max-width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal header{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal header h3{font-size:15px;font-weight:600}
.modal header .x{margin-left:auto;color:var(--text-dim);font-size:18px;width:30px;height:30px;border-radius:6px;display:grid;place-items:center}
.modal header .x:hover{background:var(--bg-hover);color:var(--text)}
.modal .body{overflow:auto;padding:16px 18px;display:grid;gap:14px}
.modal iframe{width:100%;height:340px;border:1px solid var(--border);border-radius:8px;background:#fff}
.modal textarea{width:100%;height:150px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text-dim);font:11.5px/1.5 ui-monospace,Consolas,monospace;padding:10px;resize:vertical}
.modal footer{display:flex;gap:10px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--border)}

/* ---------- инструменты таблиц (только редактор, в экспорт не идут) ---------- */
.tbl-wrap{position:relative}
.tbl-tools{position:absolute;top:-30px;right:0;display:none;gap:3px;z-index:6;background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:3px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.blk:hover .tbl-tools{display:flex}
.tbl-tools button{font-size:11px;color:var(--text-dim);padding:3px 8px;border-radius:5px;white-space:nowrap}
.tbl-tools button:hover{background:var(--bg-hover);color:var(--text)}
.col-resizer{position:absolute;top:0;right:-4px;width:8px;height:100%;cursor:col-resize;z-index:5;user-select:none}
.col-resizer:hover{background:rgba(61,123,253,.4)}

/* ============ СТИЛИ САМОГО ДОКУМЕНТА (уходят в экспорт) ============ */
/* Документ повторяет оформление Устава ВМФ «ASPER»: весь текст — Arial,
   заголовки цветные и разноуровневые, разделители набраны разрядкой. */
.asper-doc{font-family:Arial,Helvetica,'PT Sans',sans-serif;font-size:14.7px;line-height:1.5;color:#000}
.asper-doc [contenteditable]{outline:none;min-height:1em}
.asper-doc [contenteditable]:empty::before{content:attr(data-ph);color:#9aa0a6}
.asper-doc [contenteditable]:focus{background:rgba(61,123,253,.06);border-radius:2px}

/* — титульный лист: центрированный текст без рамки — */
.d-title{text-align:center;margin:8px 0 28px}
.d-title .rod{font-size:14.7px;letter-spacing:.5px}
.d-title .callsign{font-weight:700;font-size:20px;margin-top:4px}
.d-title .big{font-weight:700;font-size:38px;letter-spacing:1px;margin:14px 0 10px;line-height:1.15}
.d-title .subt{font-size:14px;color:#333}
.d-title .appr{font-size:12.7px;color:#555;margin-top:16px;line-height:1.45}

/* — оглавление — */
.d-contents{margin:18px 0}
.d-contents .cap{text-align:center;font-weight:700;font-size:11.3px;letter-spacing:4px;margin-bottom:12px}
.d-contents ul{list-style:none;padding-left:0;margin:0}
.d-contents li{margin:5px 0;text-align:left}
.d-contents li.grp{font-weight:700;margin-top:10px}

/* — разделитель «Р А З Д Е Л / Г Л А В А» (разрядка, 8.5pt) — */
.d-divider{text-align:center;font-weight:700;font-size:11.3px;letter-spacing:4px;margin:28px 0 6px;color:#1B2A3A}

/* — заголовки: Heading 1 (тёмно-синий) и Heading 2 (синий) как в Word — */
.d-h1{font-weight:700;font-size:20px;color:#1B2A3A;margin:6px 0 12px;text-align:center}
.d-h2{font-weight:700;font-size:16px;color:#23527A;margin:16px 0 6px}
.d-p{margin:8px 0;text-align:justify}

/* — нумерованные пункты: жирный только номер, текст по ширине — */
.asper-doc ol.d-clauses{margin:8px 0;padding-left:30px;list-style:decimal}
.asper-doc ol.d-clauses>li{margin:7px 0;text-align:justify}
.asper-doc ol.d-clauses>li::marker{font-weight:700}

.asper-doc ol{margin:8px 0;padding-left:26px}
.asper-doc ol ol{list-style:lower-alpha;margin:4px 0}
.asper-doc li{margin:4px 0;text-align:justify}
.asper-doc ul{margin:6px 0;padding-left:26px}

/* — врезка (как затенённые вставки-таблицы в Уставе) — */
.d-callout{background:#eef2f7;border-left:4px solid #23527A;border-radius:3px;padding:12px 16px;margin:14px 0}
.d-callout .cap{font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#23527A;margin-bottom:6px}
.d-callout .body{font-size:14px;line-height:1.45;text-align:justify}

/* — таблицы (звания и обычные) с шапкой — */
.d-table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.d-table th{background:#1B2A3A;color:#fff;font-weight:700;text-align:left;padding:7px 10px;border:1px solid #1B2A3A}
.d-table td{border:1px solid #99a3ad;padding:6px 10px;text-align:left;vertical-align:top}

/* — блок утверждения / подписи (таблица, как в Уставе) — */
.d-sign{border-collapse:collapse;width:100%;margin-top:22px}
.d-sign td{border:1px solid #99a3ad;padding:12px 16px;vertical-align:top;font-size:14px}
.d-sign .who{font-weight:700}
.d-sign .date{margin-top:8px;color:#333}
.d-sign .sig-cell{text-align:right;white-space:nowrap;width:42%}
.d-sign .sig-cell .line{letter-spacing:1px}
.d-sign .fio{margin-top:6px}
.d-hr{border:none;border-top:1.5px solid #99a3ad;margin:18px 0}
</style>
</head>
<body>

<!-- ================= ЭКРАН 1: выбор шаблона ================= -->
<div class="screen active" id="screen-create">
  <div class="create-wrap">
    <h1>Создать документ</h1>
    <p class="sub">Выберите шаблон — документ откроется предзаполненным и готовым к редактированию.</p>
    <div class="tpl-grid" id="tpl-grid"></div>
  </div>
</div>

<!-- ================= ЭКРАН 2: редактор ================= -->
<div class="screen" id="screen-editor">
  <div class="topbar">
    <button class="back" onclick="goHome()" title="Назад">←</button>
    <input class="doc-title" id="doc-title" value="Без названия">
    <span class="save-state"><span class="ok">✓</span> <span id="save-label">Сохранено</span></span>
    <div class="spacer"></div>
    <button class="btn" onclick="openBlockMenuAtEnd(event)">＋ Блок</button>
    <button class="btn primary" onclick="exportDoc()">Сохранить HTML</button>
  </div>

  <div class="toolbar">
    <button class="tb" data-cmd="bold" title="Жирный"><b>B</b></button>
    <button class="tb" data-cmd="italic" title="Курсив"><b><i>I</i></b></button>
    <button class="tb" data-cmd="underline" title="Подчёркнутый"><b><u>U</u></b></button>
    <button class="tb" data-cmd="strikeThrough" title="Зачёркнутый"><b><s>S</s></b></button>
    <span class="tb-sep"></span>
    <button class="tb" data-cmd="justifyLeft" title="По левому краю">⇤</button>
    <button class="tb" data-cmd="justifyCenter" title="По центру">↔</button>
    <button class="tb" data-cmd="justifyRight" title="По правому краю">⇥</button>
    <span class="tb-sep"></span>
    <button class="tb" data-cmd="insertUnorderedList" title="Маркированный список">•≡</button>
    <button class="tb" data-cmd="insertOrderedList" title="Нумерованный список">1≡</button>
    <span class="hint">Наведите на блок — слева появятся действия. «＋» между блоками добавляет новый.</span>
  </div>

  <div class="workspace" id="workspace">
    <div class="page">
      <div class="asper-doc" id="doc"></div>
    </div>
  </div>

  <div class="statusbar"><span id="counter">0 слов · 0 симв.</span></div>
</div>

<!-- меню вставки блока -->
<div class="blockmenu" id="blockmenu">
  <div class="bm-cols">
    <div><h4>Блоки Устава</h4><div id="bm-template"></div></div>
    <div><h4>Обычные блоки</h4><div id="bm-custom"></div></div>
  </div>
</div>

<!-- модалка экспорта -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <header><h3>Готовый документ (чистый HTML)</h3><button class="x" onclick="closeModal()">✕</button></header>
    <div class="body">
      <iframe id="preview"></iframe>
      <textarea id="html-out" readonly></textarea>
    </div>
    <footer>
      <button class="btn" onclick="copyHtml()">Скопировать HTML</button>
      <button class="btn primary" onclick="downloadHtml()">Скачать .html</button>
    </footer>
  </div>
</div>

<script>

   иконка и html() — разметка с contenteditable-полями.
   В реальном приложении это ваш источник правды: блоки можно

/* --- создание документа из шаблона --- */
function createFromTemplate(key){
  const t = TEMPLATES[key];
  doc().innerHTML = '';
  doc().appendChild(makeAdder());              // «+» перед первым блоком
  for (const b of t.blocks){
    const html = b.override ?? BLOCKS[b.id].html(...(b.args||[]));
    doc().appendChild(makeBlock(b.id, html));
    doc().appendChild(makeAdder());            // «+» после каждого блока
  }
  $('#doc-title').value = t.title;
  $('#screen-create').classList.remove('active');
  $('#screen-editor').classList.add('active');
  enhanceTables(doc());
  updateCounter(); markSaved();
}

/* --- обёртка блока с контролами --- */
function makeBlock(id, html){
  const w = document.createElement('div');
  w.className = 'blk';
  w.dataset.block = id;
  w.innerHTML = `
    <span class="blk-tag">${BLOCKS[id]?.title || 'Блок'}</span>
    <div class="blk-ctl">
      <button title="Выше" onclick="moveBlock(this,-1)">↑</button>
      <button title="Ниже" onclick="moveBlock(this,1)">↓</button>
      <button title="Дублировать" onclick="dupBlock(this)">⧉</button>
      <button class="del" title="Удалить" onclick="delBlock(this)">✕</button>
    </div>
    <div class="blk-body">${html}</div>`;
  return w;
}

function makeAdder(){
  const a = document.createElement('div');
  a.className = 'adder';
  a.innerHTML = `<div class="line"></div><button class="plus" title="Добавить блок">＋</button>`;
  a.querySelector('.plus').onclick = e => openBlockMenu(e, a);
  return a;
}

/* --- действия над блоками --- */
window.moveBlock = (btn, dir) => {
  const blk = btn.closest('.blk');
  const pair = [blk.previousElementSibling, blk];              // adder + блок двигаем вместе
  const target = dir < 0 ? blk.previousElementSibling?.previousElementSibling?.previousElementSibling
                         : blk.nextElementSibling?.nextElementSibling;
  if (dir < 0 && target) doc().insertBefore(pair[0], target), doc().insertBefore(pair[1], target);
  if (dir > 0 && target){ const after = target.nextElementSibling; doc().insertBefore(pair[0], after), doc().insertBefore(pair[1], after); }
  markDirty();
};
window.dupBlock = btn => {
  const blk = btn.closest('.blk');
  const copy = makeBlock(blk.dataset.block, blk.querySelector('.blk-body').innerHTML);
  blk.after(makeAdder()); blk.nextElementSibling.after(copy);
  stripTableEnh(copy); enhanceTables(doc());
  markDirty();
};
window.delBlock = btn => {
  const blk = btn.closest('.blk');
  blk.previousElementSibling?.remove();   // убираем adder перед блоком
  blk.remove();
  markDirty();
};

let menuAnchor = null;
function buildBlockMenu(){
  const tEl = $('#bm-template'), cEl = $('#bm-custom');
  for (const [id,b] of Object.entries(BLOCKS)){
    const item = document.createElement('button');
    item.className = 'bm-item';
    item.innerHTML = `<span class="ic">${b.icon}</span><span><div class="t">${b.title}</div><div class="d">${b.desc}</div></span>`;
    item.onclick = () => insertBlock(id);
    (b.group==='template'? tEl : cEl).appendChild(item);

}
function openBlockMenu(e, adder){
  e.stopPropagation();
  menuAnchor = adder;
  const m = $('#blockmenu');
  m.classList.add('open'); adder.classList.add('open');
  const r = adder.getBoundingClientRect();
  const mw = 560;
  m.style.left = Math.max(12, Math.min(window.innerWidth - mw - 12, r.left + r.width/2 - mw/2)) + 'px';
  m.style.top  = Math.min(window.innerHeight - 320, r.bottom + 8) + 'px';
}

  const adders = doc().querySelectorAll('.adder');
  openBlockMenu(e, adders[adders.length-1]);
};
function insertBlock(id){
  const blk = makeBlock(id, BLOCKS[id].html());
  menuAnchor.after(blk); blk.after(makeAdder());
  enhanceTables(doc());
  closeBlockMenu();
  blk.querySelector('[contenteditable]')?.focus();
  markDirty();
}
function closeBlockMenu(){
  $('#blockmenu').classList.remove('open');

}

/* ================================================================
   3b. ТАБЛИЦЫ: добавление строк/столбцов и растягивание ширины мышью
================================================================ */
function enhanceTables(scope){
  scope.querySelectorAll('table.d-table:not([data-enh])').forEach(setupTable);
}
function setupTable(table){
  table.dataset.enh = '1';
  const wrap = document.createElement('div');
  wrap.className = 'tbl-wrap';
  table.replaceWith(wrap);
  wrap.appendChild(table);

  const tools = document.createElement('div');
  tools.className = 'tbl-tools';
  tools.contentEditable = 'false';
  const mk = (label, title, fn) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = label; b.title = title;
    b.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); });
    b.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); fn(); markDirty(); });
    return b;
  };
  tools.append(
    mk('+ строка', 'Добавить строку', () => addRow(table)),
    mk('+ столбец', 'Добавить столбец', () => addCol(table)),
    mk('− строка', 'Удалить строку', () => delRow(table)),
    mk('− столбец', 'Удалить столбец', () => delCol(table)),
  );
  wrap.appendChild(tools);

  const remember = e => { const c = e.target.closest('td,th'); if (c) table._cell = c; };
  table.addEventListener('focusin', remember);
  table.addEventListener('click', remember);

  attachResizers(table);
}
function activeCell(table){
  return (table._cell && table.contains(table._cell)) ? table._cell : null;
}
function addRow(table){
  const body = table.tBodies[0] || table;
  const cols = table.rows[0] ? table.rows[0].cells.length : 1;
  const cell = activeCell(table);
  const row = document.createElement('tr');
  for (let i=0;i<cols;i++){ const td=document.createElement('td'); td.innerHTML='&nbsp;'; row.appendChild(td); }
  let ref = null;
  if (cell && cell.parentElement.parentElement === body) ref = cell.parentElement.nextSibling;
  body.insertBefore(row, ref);
}
function addCol(table){
  const cell = activeCell(table);
  const at = cell ? cell.cellIndex + 1 : (table.rows[0] ? table.rows[0].cells.length : 0);
  [...table.rows].forEach(r => {
    const isHead = r.parentElement.tagName === 'THEAD';
    const c = document.createElement(isHead ? 'th' : 'td');
    c.innerHTML = isHead ? 'Заголовок' : '&nbsp;';
    r.insertBefore(c, r.cells[at] || null);
  });
  const cg = table.querySelector('colgroup');
  if (cg){ const col=document.createElement('col'); cg.insertBefore(col, cg.children[at] || null); }
  attachResizers(table);
}
function delRow(table){
  const body = table.tBodies[0] || table;
  if (body.rows.length <= 1) return;
  const cell = activeCell(table);
  const row = (cell && cell.parentElement.parentElement === body) ? cell.parentElement : body.rows[body.rows.length-1];
  row.remove();
}
function delCol(table){
  const first = table.rows[0];
  if (!first || first.cells.length <= 1) return;
  const cell = activeCell(table);
  const idx = cell ? cell.cellIndex : first.cells.length-1;
  [...table.rows].forEach(r => { if (r.cells[idx]) r.cells[idx].remove(); });
  const cg = table.querySelector('colgroup');
  if (cg && cg.children[idx]) cg.children[idx].remove();
}
function attachResizers(table){
  const head = table.rows[0];
  if (!head) return;
  [...head.cells].forEach((cell, i) => {
    if (cell.querySelector(':scope > .col-resizer')) return;
    cell.style.position = 'relative';
    const h = document.createElement('div');
    h.className = 'col-resizer';
    h.contentEditable = 'false';
    h.addEventListener('mousedown', e => startResize(e, table, i));
    cell.appendChild(h);
  });
}
function ensureFixed(table){
  if (table.dataset.fixed) return;
  const head = table.rows[0];
  const widths = [...head.cells].map(c => c.getBoundingClientRect().width);
  const cg = document.createElement('colgroup');
  widths.forEach(w => { const col=document.createElement('col'); col.style.width = Math.round(w)+'px'; cg.appendChild(col); });
  table.insertBefore(cg, table.firstChild);
  table.style.tableLayout = 'fixed';
  table.dataset.fixed = '1';
}
function startResize(e, table, i){
  e.preventDefault(); e.stopPropagation();
  ensureFixed(table);
  const cols = table.querySelector('colgroup').children;
  const startX = e.clientX, startW = parseFloat(cols[i].style.width);
  document.body.style.cursor = 'col-resize';
  const move = ev => { cols[i].style.width = Math.max(40, startW + (ev.clientX - startX)) + 'px'; };
  const up = () => {
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    document.body.style.cursor = '';
    markDirty();
  };
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}
function stripTableEnh(root){
  root.querySelectorAll('.col-resizer, .tbl-tools').forEach(n => n.remove());
  root.querySelectorAll('.tbl-wrap').forEach(w => { const t=w.querySelector('table'); if (t) w.replaceWith(t); });
  root.querySelectorAll('table').forEach(t => t.removeAttribute('data-enh'));
}

function cleanDocHtml(){
  const clone = doc().cloneNode(true);
  clone.querySelectorAll('.adder, .blk-ctl, .blk-tag').forEach(n=>n.remove());
  // убираем интерфейс управления таблицами, сохраняя заданные ширины столбцов
  clone.querySelectorAll('.col-resizer, .tbl-tools').forEach(n=>n.remove());
  clone.querySelectorAll('.tbl-wrap').forEach(w=>{ const t=w.querySelector('table'); if(t) w.replaceWith(t); });
  clone.querySelectorAll('table[data-enh]').forEach(t=>{ t.removeAttribute('data-enh'); t.removeAttribute('data-fixed'); });
  clone.querySelectorAll('td,th').forEach(c=>{ if(c.style.position==='relative'){ c.style.position=''; if(!c.getAttribute('style')) c.removeAttribute('style'); } });
  clone.querySelectorAll('[contenteditable]').forEach(n=>{
    n.removeAttribute('contenteditable'); n.removeAttribute('data-ph');
    if (!n.textContent.trim() && !n.querySelector('img')) n.remove();  // пустые поля не тащим в экспорт
  });
  // разворачиваем обёртки блоков, но оставляем data-block — пригодится для повторного открытия в редакторе
  clone.querySelectorAll('.blk').forEach(b=>{
    const body = b.querySelector('.blk-body');
    const holder = document.createElement('div');
    holder.dataset.block = b.dataset.block;
    holder.innerHTML = body.innerHTML;
    b.replaceWith(holder);
  });
  return clone.innerHTML;
}

function exportDoc(){
  const title = $('#doc-title').value || 'Документ';
  const html = `<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>${title}</title>
<style>${DOC_CSS}</style></head>
<body><div class="page">
