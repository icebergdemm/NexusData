<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or 'Что-то пошло не так' }} - Nexus Data</title>
    <link rel="stylesheet" href="/static/admin/admin_styles.css">
  </head>
  <body>
    <div class="container">
      <div class="card text-center">
        <h2>{{ title or 'Что-то пошло не так' }}</h2>
        <p class="mb-2">{{ message or 'Произошла непредвиденная ошибка. Попробуйте позже.' }}</p>
        {% if details %}
        <p class="mb-2"><small>Код: {{ details }}</small></p>
        {% endif %}
        <div class="flex-row text-center">
          <a href="{{ back_url or '/login' }}" class="btn">{{ back_text or 'Назад' }}</a>
          <a href="/admin" class="btn btn-secondary">На главную</a>
        </div>
      </div>
    </div>
  </body>
</html>
